name: Dispatch PixelOS 15 beyond2lte build

on:
  push:
    paths:
      - '.github/workflows/dispatch-beyond2lte-pixelos.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Crave Builder for beyond2lte
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run selfhosted.yml \
            --ref main \
            -f BASE_PROJECT='PixelOS 15' \
            -f BUILD_DIFFERENT_ROM="echo 'Build Starting!'" \
            -f REMOVALS='' \
            -f LOCAL_MANIFEST='https://raw.githubusercontent.com/RetroFrost/crave_aosp_builder/main/local_manifests/beyond2lte-pixelos15.xml' \
            -f LOCAL_MANIFEST_BRANCH='main' \
            -f DEVICE_NAME='beyond2lte' \
            -f PRODUCT_NAME='aosp_beyond2lte' \
            -f BUILD_COMMAND='mka bacon' \
            -f BUILD_TYPE='userdebug' \
            -f CLEAN_BUILD='no'
